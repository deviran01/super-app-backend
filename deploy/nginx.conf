# Container nginx: serves /usr/share/nginx/html (the exported config folder) on :8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    autoindex off;

    charset utf-8;
    charset_types application/json;
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Read-only API: anything but GET/HEAD is refused.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Clients revalidate on every launch with If-None-Match (ETag): a change, a hard update
    # included, reaches users on their next launch, and an unchanged file costs a 304.
    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Images keep their name until they change (give a changed image a new name).
    location ~ ^/(logos|icons)/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

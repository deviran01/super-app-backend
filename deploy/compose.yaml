# Daricheh super-app config backend: the static config document and its images, served by
# an unprivileged nginx on loopback only. The host nginx terminates TLS for
# superapp.2z2.ir and proxies here (host-nginx/superapp.2z2.ir.conf).
#
# Content lives in ./public (bind-mounted read-only), so a deploy replaces files without
# restarting anything. A future REST backend replaces this service on the same port.
name: superapp

services:
  config:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    container_name: superapp-config
    restart: unless-stopped
    ports:
      - "127.0.0.1:8120:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
    # Hardened and capped so it can never starve the other stacks on this host.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

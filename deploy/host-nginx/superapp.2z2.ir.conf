# Anar super-app REST API and admin dashboard.
# Proxies to the superapp-api container on loopback :8120 (/srv/superapp).
# superapp.2z2.ir is proxied by ArvanCloud CDN: Arvan terminates TLS for users and connects
# to this origin over HTTPS, so the 443 block is what serves the app (and ACME renewals,
# which arrive through Arvan's HTTP→HTTPS redirect).
server {
    listen 80;
    listen [::]:80;
    server_name superapp.2z2.ir;

    # ACME HTTP-01 challenges.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name superapp.2z2.ir;

    ssl_certificate /etc/letsencrypt/live/superapp.2z2.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/superapp.2z2.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # X-Forwarded-For is replaced, not appended to: a client-supplied value must never decide
    # the address the app sees (sign-in lockouts are per address).

    add_header X-Content-Type-Options nosniff always;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # The app only GETs, except its small usage report and feedback below.
    client_max_body_size 1k;

    # Anonymous daily usage totals from the app: POST only, small JSON.
    location = /api/v1/events {
        limit_except POST {
            deny all;
        }
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Feedback messages from the app: POST only, small JSON (the app refuses more than 8 KB too;
    # its challenge, GET /api/v1/feedback/challenge, goes through the GET-only block below).
    location = /api/v1/feedback {
        limit_except POST {
            deny all;
        }
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # The admin dashboard: sign-in and edits (small JSON; the app refuses more than 256 KB too).
    location /admin {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Image uploads from the dashboard (the app checks the size and pixels again).
    location /admin/api/images/ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}

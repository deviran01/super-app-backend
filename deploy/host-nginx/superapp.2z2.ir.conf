# Anar super-app REST API and admin dashboard.
# Proxies to the superapp-api container on loopback :8120 (/srv/superapp).
# superapp.2z2.ir is proxied by ArvanCloud CDN: Arvan terminates TLS for users and connects
# to this origin over HTTPS, so the 443 block is what serves the app (and ACME renewals,
# which arrive through Arvan's HTTP→HTTPS redirect).
server {
    listen 80;
    listen [::]:80;
    server_name superapp.2z2.ir;

    # ACME HTTP-01 challenges.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name superapp.2z2.ir;

    ssl_certificate /etc/letsencrypt/live/superapp.2z2.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/superapp.2z2.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # The app only ever GETs; nothing is uploaded.
    client_max_body_size 1k;

    # The admin dashboard: sign-in, edits and image uploads (the public API stays read-only).
    location /admin {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}

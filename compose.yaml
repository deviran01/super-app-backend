# Daricheh API and admin dashboard. Production: /srv/superapp on the server, published on
# 127.0.0.1:8120 behind the host nginx (deploy/host-nginx/).
# Locally: SUPERAPP_PORT=8080 SUPERAPP_DEV=1 docker compose up --build
name: superapp

services:
  api:
    build: .
    image: superapp-api:latest
    container_name: superapp-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SUPERAPP_PORT:-8120}:8000"
    environment:
      # QA overlays from scenarios/ (e.g. "lab,force-update"); empty in production.
      SUPERAPP_SCENARIOS: ${SUPERAPP_SCENARIOS:-}
      # 1 locally (plain http): admin cookies without the Secure flag.
      SUPERAPP_DEV: ${SUPERAPP_DEV:-}
    volumes:
      # Written by the admin dashboard: drafts, history, accounts, published files and
      # uploaded images. Owned by the container's user (uid 10001).
      - ./data:/srv/data
      - ./public:/srv/public
    # Hardened and capped so it can never starve other services on the host.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
